<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wedding Invitation</title>
  <meta name="description" content="You're invited to celebrate our wedding">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <p class="eyebrow">Together with their families</p>
    <h1><span data-field="bride">Bride</span> <span class="amp">&amp;</span> <span data-field="groom">Groom</span></h1>
    <p class="lead">request the pleasure of your company<br>at the celebration of their marriage</p>
    <p class="date" data-field="dateText"></p>
    <div class="countdown" id="countdown" aria-live="polite"></div>
    <a class="btn" href="#rsvp">RSVP</a>
  </header>

  <main>
    <section class="story">
      <h2>Our Story</h2>
      <p data-field="story"></p>
    </section>

    <section class="events">
      <h2>Celebrations</h2>
      <div class="cards" id="events"></div>
    </section>

    <section class="venue">
      <h2>Venue</h2>
      <p class="venue-name" data-field="venueName"></p>
      <p data-field="venueAddress"></p>
      <a class="btn btn-outline" id="mapLink" target="_blank" rel="noopener">View on Map</a>
    </section>

    <section class="rsvp" id="rsvp">
      <h2>RSVP</h2>
      <p>Kindly respond by <strong data-field="rsvpBy"></strong></p>
      <form id="rsvpForm">
        <label>Your name <input name="name" required></label>
        <label>Number of guests <input name="guests" type="number" min="1" max="10" value="1" required></label>
        <label>Will you attend?
          <select name="attending">
            <option>Joyfully accepts</option>
            <option>Regretfully declines</option>
          </select>
        </label>
        <label>Message for the couple <textarea name="message" rows="3"></textarea></label>
        <button class="btn" type="submit">Send RSVP</button>
      </form>
    </section>
  </main>

  <footer>
    <p>With love, <span data-field="bride"></span> &amp; <span data-field="groom"></span></p>
  </footer>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>

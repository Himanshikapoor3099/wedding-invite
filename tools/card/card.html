<!doctype html>
<!-- Image-only invitation card. Rendered to a 1080x1920 picture by tools/make-cards.js -->
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Italianno&family=Jost:wght@400;500&family=Noto+Serif+Devanagari:wght@500&family=Noto+Serif+Gurmukhi:wght@500&family=Playfair+Display:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: #fcefd3; color: #4b291b; font-family: Jost, sans-serif; text-align: center; }
  .card { position: relative; width: 100%; height: 100%; }
  .art { position: absolute; left: 0; right: 0; bottom: 0; height: 47%; background-size: cover; background-position: 50% 62%; }
  .art::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, #fcefd3 0%, rgba(252,239,211,.85) 12%, rgba(252,239,211,0) 34%); }
  .frame { position: absolute; inset: 28px; border: 2px solid rgba(180,138,82,.6); border-radius: 18px; pointer-events: none; }
  .text { position: relative; padding: 70px 90px 0; }
  .mono { width: 210px; height: 210px; display: block; margin: 0 auto 18px; }
  .bless { display: flex; justify-content: center; gap: 28px; font-size: 26px; color: #6b4c3f; margin-bottom: 18px; }
  .bless [lang=hi] { font-family: "Noto Serif Devanagari", serif; } .bless [lang=pa] { font-family: "Noto Serif Gurmukhi", serif; }
  .together { font: 500 22px Cinzel, serif; letter-spacing: .28em; color: #6b4c3f; margin-bottom: 14px; }
  .name { font: 400 96px/1 Italianno, cursive; color: #4b291b; }
  .par { font-size: 24px; line-height: 1.45; color: #6b4c3f; margin-top: 2px; }
  .amp { font: 400 70px/1 Italianno, cursive; color: #9a6a2e; margin: 6px 0 2px; }
  .req { font: italic 400 32px/1.4 "Playfair Display", serif; margin: 24px 0 8px; }
  .event { font: 400 120px/1 Italianno, cursive; color: var(--accent, #9b111e); margin: 4px 0 10px; }
  .when { font: 500 26px Cinzel, serif; letter-spacing: .16em; }
  .venue { font: 500 30px "Playfair Display", serif; margin-top: 10px; }
  .tag { font: 500 20px Jost, sans-serif; letter-spacing: .3em; color: #9a6a2e; margin-top: 16px; }

  /* themes and layouts, chosen by the hash: #sangeet-full, #wedding-arch ... */
  body.t-night { background: #0f1a33; color: #eef2f8; }
  body.t-night .bless, body.t-night .together, body.t-night .par { color: #c3cde0; }
  body.t-night .name { color: #f4f7fb; } body.t-night .amp, body.t-night .tag { color: #c9d1dc; }
  body.t-night .frame { border-color: rgba(201,209,220,.55); }
  body.t-blush { background: #f8ece4; }
  .t-night.l-fade .art::before { background: linear-gradient(180deg, #0f1a33 0%, #0f1a33 10%, rgba(15,26,51,.6) 24%, rgba(15,26,51,0) 42%); }
  .l-full .art { top: 0; height: 100%; background-position: 50% 100%; }
  .l-full .art::before { background: linear-gradient(180deg, var(--wash) 0%, var(--wash) 44%, var(--wash-0) 70%); }
  .l-arch .art { left: 150px; right: 150px; bottom: 90px; height: 37%; border-radius: 390px 390px 18px 18px; border: 6px solid var(--rim); box-shadow: 0 18px 40px rgba(0,0,0,.25); }
  .l-arch .art::before { display: none; }
  .l-arch .text { padding-top: 60px; }
  .l-arch .mono { width: 180px; height: 180px; }

  /* video mode (?video): the card builds up line by line while the painting slowly zooms */
  .video .text > *, .video .frame { opacity: 0; animation: rise 1.1s ease forwards; }
  .video .art { opacity: 0; animation: art-in 1.6s ease .2s forwards, zoom 10s linear forwards; transform-origin: 50% 60%; }
  .video .event { animation-name: pop; }
  @keyframes rise { from { opacity: 0; translate: 0 18px; } to { opacity: 1; translate: 0 0; } }
  @keyframes pop { from { opacity: 0; scale: .85; } to { opacity: 1; scale: 1; } }
  @keyframes art-in { to { opacity: 1; } }
  @keyframes zoom { from { scale: 1; } to { scale: 1.07; } }
</style></head>
<body><div class="card">
  <div class="art" id="art"></div>
  <div class="text">
    <img class="mono" src="../../assets/art/monogram.png" alt="">
    <div class="bless"><span lang="hi">॥ श्री गणेशाय नमः ॥</span><span lang="pa">॥ ੴ ਵਾਹਿਗੁਰੂ ॥</span></div>
    <p class="together">TOGETHER WITH THEIR FAMILIES</p>
    <p class="name">Karan Sachdeva</p>
    <p class="par">Son of Mrs. Meenu &amp; Mr. Gulshan Sachdeva</p>
    <p class="amp">&amp;</p>
    <p class="name">Himanshi Kapoor</p>
    <p class="par">Daughter of Mrs. Pramila &amp; Mr. Gulshan Kapoor<br>and Mrs. Chanchal &amp; Mr. Praveen Kapoor</p>
    <p class="req">request your gracious presence at the</p>
    <p class="event" id="event"></p>
    <p class="when" id="when"></p>
    <p class="venue" id="venue"></p>
    <p class="tag">#KARAN-MANI-FESTED</p>
  </div>
  <div class="frame"></div>
</div>
<script>
  const CARDS = {
    wedding:  { event: "Wedding", when: "Tuesday · 01 December 2026 · 11 am", venue: "Ambria Pushpanjali, New Delhi", art: "ev-wedding.jpg", accent: "#9b111e", pos: "50% 31%" },
    sangeet:  { event: "Sangeet Night", when: "Saturday · 28 November 2026 · 7 pm", venue: "ClubXO, New Delhi", art: "ev-cocktail.jpg", accent: "#2c3f6b", pos: "50% 45%" },
  };
  // optional "-layout" and "-theme" after the card name, e.g. #sangeet-full-night
  const [name, layout = "fade", theme] = location.hash.slice(1).split("-");
  const c = CARDS[name] || CARDS.wedding;
  const THEMES = {
    night: { wash: "rgba(15,26,51,.94)", wash0: "rgba(15,26,51,0)", rim: "#c9d1dc", accent: "#dfe6f0" },
    blush: { wash: "rgba(248,236,228,.95)", wash0: "rgba(248,236,228,0)", rim: "#d9b48a", accent: "#9b111e" },
    cream: { wash: "rgba(252,239,211,.95)", wash0: "rgba(252,239,211,0)", rim: "#c9a26b", accent: c.accent },
  };
  const t = THEMES[theme] || THEMES.cream;
  document.body.classList.add("l-" + layout, "t-" + (theme || "cream"));
  document.getElementById("event").textContent = c.event;
  document.getElementById("when").textContent = c.when;
  document.getElementById("venue").textContent = c.venue;
  const st = document.body.style;
  st.setProperty("--accent", t.accent); st.setProperty("--wash", t.wash); st.setProperty("--wash-0", t.wash0); st.setProperty("--rim", t.rim);
  if (location.search.includes("video")) {
    document.body.classList.add("video");
    [...document.querySelectorAll(".text > *")].forEach((el, i) => { el.style.animationDelay = (0.6 + i * 0.42) + "s"; });
    document.querySelector(".frame").style.animationDelay = "5.8s";
  }
  const art = document.getElementById("art");
  art.style.backgroundImage = `url(../../assets/art/${c.art})`;
  if (layout === "fade") art.style.backgroundPosition = c.pos;
  if (layout === "arch") art.style.backgroundPosition = name === "wedding" ? "50% 30%" : "50% 40%";
</script>
</body></html>
